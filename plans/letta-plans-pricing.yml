specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Letta
providerId: letta
created: '2026-05-08'
modified: '2026-05-22'
reconciled: true
tags:
- AI
- Agents
- Memory
- MemGPT
- Stateful
- Plans
description: >-
  Letta API Cloud is $20/month base + $0.10 per active agent per month + $0.00015/sec for
  tool execution + pay-as-you-go LLM usage at provider cost. Self-hosted Letta is free
  except for hosting and your own LLM API costs. Enterprise plans are custom.
notes: Reconciled from docs.letta.com/guides/api/plans (May 2026).
sources:
- https://docs.letta.com/guides/api/plans
- https://www.letta.com/pricing
plans:
- id: letta-self-hosted
  name: Self-Hosted (Open Source)
  type: free
  description: Self-host the open-source Letta server; pay only your hosting and LLM API costs.
  entries:
  - label: Plan Fee
    name: plan_fee
    type: flat
    metric: month
    limit: 1
    timeFrame: month
    geo: global
    unit: 1
    price: 0 USD/month (Letta is free; you pay infra and LLM)
    userMultiplied: false
- id: letta-api
  name: API Plan (Cloud)
  type: subscription
  description: Letta Cloud monthly fee plus pay-as-you-go agent and tool execution charges.
  entries:
  - label: Plan Fee
    name: plan_fee
    type: flat
    metric: month
    limit: 1
    timeFrame: month
    geo: global
    unit: 1
    price: 20 USD/month
    userMultiplied: false
  - label: Active Agent
    name: active_agent
    type: subscription
    metric: agent-month
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: 0.10 USD per active agent per month
    userMultiplied: false
  - label: Tool Execution
    name: tool_execution
    type: per_unit
    metric: second
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: 0.00015 USD/sec
    userMultiplied: false
  - label: LLM Usage
    name: llm_usage
    type: passthrough
    metric: token
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: provider cost (pay-as-you-go)
    userMultiplied: false
  elements:
  - name: Unlimited agents
  - name: API key authentication
- id: letta-enterprise
  name: Enterprise
  type: enterprise
  description: Volume pricing, increased quotas, RBAC, SAML/OIDC SSO, dedicated support.
  entries:
  - label: Enterprise Contract
    name: enterprise
    type: flat
    metric: contract
    limit: -1
    timeFrame: annual
    geo: global
    unit: 1
    price: contact sales
    userMultiplied: false
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
