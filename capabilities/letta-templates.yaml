          path: "/v1/templates"
          operations:
            - name: "templates_listtemplates"
              method: GET
              description: "List Templates (Cloud-only)"
              inputParameters:
                - name: "offset"
                  in: query
                  type: string
                  required: false
                  description: "offset parameter"
                - name: "exact"
                  in: query
                  type: string
                  required: false
                  description: "Whether to search for an exact name match"
                - name: "limit"
                  in: query
                  type: string
                  required: false
                  description: "limit parameter"
                - name: "version"
                  in: query
                  type: string
                  required: false
                  description: "Specify the version you want to return, otherwise will return the latest version"
                - name: "template_id"
                  in: query
                  type: string
                  required: false
                  description: "template_id parameter"
                - name: "name"
                  in: query
                  type: string
                  required: false
                  description: "name parameter"
                - name: "search"
                  in: query
                  type: string
                  required: false
                  description: "search parameter"
                - name: "project_slug"
                  in: query
                  type: string
                  required: false
                  description: "project_slug parameter"
                - name: "project_id"
                  in: query
                  type: string
                  required: false
                  description: "project_id parameter"
                - name: "sort_by"
                  in: query
                  type: string
                  required: false
                  description: "sort_by parameter"
