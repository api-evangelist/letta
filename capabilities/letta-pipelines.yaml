naftiko: "1.0.0-alpha2"

info:
  label: "Letta API — Pipelines"
  description: >-
    Pipelines — composable agent pipelines. 10 operations. Lead operation: Create Pipeline. Self-contained Naftiko capability covering one Letta business surface.
  tags:
    - Letta
    - Stateful Agents
    - Pipelines
  created: "2026-05-08"
  modified: "2026-05-22"

binds:
  - namespace: env
    keys:
      LETTA_API_KEY: LETTA_API_KEY

capability:

  consumes:
    - type: http
      namespace: "letta-pipelines"
      baseUri: "https://api.letta.com"
      description: "Letta API — Pipelines business capability. Self-contained, no shared references."
      authentication:
        type: bearer
        token: "{{env.LETTA_API_KEY}}"
      resources:
        - name: "pipelines"
          path: "/v1/pipelines"
          operations:
            - name: "pipelines_createpipeline"
              method: POST
              description: "Create Pipeline"
              inputParameters:
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Body"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: "pipelines_listpipelines"
              method: GET
              description: "List Pipelines"
              inputParameters:
                - name: "search"
                  in: query
                  type: string
                  required: false
                  description: "search parameter"
                - name: "integration_type"
                  in: query
                  type: string
                  required: false
                  description: "integration_type parameter"
                - name: "integration_id"
                  in: query
                  type: string
                  required: false
                  description: "integration_id parameter"
                - name: "offset"
                  in: query
                  type: string
                  required: false
                  description: "offset parameter"
                - name: "limit"
                  in: query
                  type: string
                  required: false
                  description: "limit parameter"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "pipelines-count"
          path: "/v1/pipelines/count"
          operations:
            - name: "pipelines_countpipelines"
              method: GET
              description: "Count Pipelines"
              inputParameters:
                - name: "search"
                  in: query
                  type: string
                  required: false
                  description: "search parameter"
                - name: "integration_type"
                  in: query
                  type: string
                  required: false
                  description: "integration_type parameter"
                - name: "integration_id"
                  in: query
                  type: string
                  required: false
                  description: "integration_id parameter"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "pipelines-by-id"
          path: "/v1/pipelines/{pipeline_id}"
          operations:
            - name: "pipelines_getpipeline"
              method: GET
              description: "Get Pipeline"
              inputParameters:
                - name: "pipeline_id"
                  in: path
                  type: string
                  required: true
                  description: "pipeline_id parameter"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: "pipelines_updatepipeline"
              method: PATCH
              description: "Update Pipeline"
              inputParameters:
                - name: "pipeline_id"
                  in: path
                  type: string
                  required: true
                  description: "pipeline_id parameter"
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Body"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: "pipelines_deletepipeline"
              method: DELETE
              description: "Delete Pipeline"
              inputParameters:
                - name: "pipeline_id"
                  in: path
                  type: string
                  required: true
                  description: "pipeline_id parameter"
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Body"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "pipelines-by-id-config"
          path: "/v1/pipelines/{pipeline_id}/config"
          operations:
            - name: "pipelines_updatepipelineproducerconfig"
              method: PATCH
              description: "Update Pipeline Producer Config"
              inputParameters:
                - name: "pipeline_id"
                  in: path
                  type: string
                  required: true
                  description: "pipeline_id parameter"
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Body"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "pipelines-preview"
          path: "/v1/pipelines/preview"
          operations:
            - name: "pipelines_previewpipeline"
              method: POST
              description: "Preview Pipeline"
              inputParameters:
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Body"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "pipelines-by-id-sync"
          path: "/v1/pipelines/{pipeline_id}/sync"
          operations:
            - name: "pipelines_syncpipeline"
              method: POST
              description: "Sync Pipeline"
              inputParameters:
                - name: "pipeline_id"
