        - path: "/v1/pipelines/preview"
          name: "pipelines-preview"
          description: "REST surface for pipelines-preview."
          operations:
            - method: POST
              name: "pipelines_previewpipeline"
              description: "Preview Pipeline"
              call: "letta-pipelines.pipelines_previewpipeline"
