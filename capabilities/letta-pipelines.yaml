      namespace: "letta-pipelines-mcp"
      port: 9090
      transport: http
      description: "MCP adapter for Letta API — Pipelines. One verb-noun tool per consumed operation."
      tools:
        - name: "create-pipeline"
          description: "Create Pipeline"
          hints:
