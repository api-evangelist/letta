          name: "pipelines"
          description: "REST surface for pipelines."
          operations:
            - method: POST
              name: "pipelines_createpipeline"
              description: "Create Pipeline"
              call: "letta-pipelines.pipelines_createpipeline"
              with:
                "body": "rest.body"
              outputParameters:
