                  required: true
                  description: "feed_id parameter"
                - name: "subscription_id"
                  in: path
                  type: string
                  required: true
                  description: "subscription_id parameter"
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Body"
