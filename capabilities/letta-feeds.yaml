naftiko: "1.0.0-alpha2"

info:
  label: "Letta API — Feeds"
  description: >-
    Feeds — subscribed feeds that drive agents. 16 operations. Lead operation: Create Feed. Self-contained Naftiko capability covering one Letta business surface.
  tags:
    - Letta
    - Stateful Agents
    - Feeds
  created: "2026-05-08"
  modified: "2026-05-22"

binds:
  - namespace: env
    keys:
      LETTA_API_KEY: LETTA_API_KEY

capability:

  consumes:
    - type: http
      namespace: "letta-feeds"
      baseUri: "https://api.letta.com"
      description: "Letta API — Feeds business capability. Self-contained, no shared references."
      authentication:
        type: bearer
        token: "{{env.LETTA_API_KEY}}"
      resources:
        - name: "feeds"
          path: "/v1/feeds"
          operations:
            - name: "feeds_createfeed"
              method: POST
              description: "Create Feed"
              inputParameters:
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Body"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: "feeds_listfeeds"
              method: GET
              description: "List Feeds"
              inputParameters:
                - name: "project_id"
                  in: query
                  type: string
                  required: false
                  description: "project_id parameter"
                - name: "name"
                  in: query
                  type: string
                  required: false
                  description: "name parameter"
                - name: "limit"
                  in: query
                  type: string
                  required: false
                  description: "limit parameter"
                - name: "offset"
                  in: query
                  type: string
                  required: false
                  description: "offset parameter"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "feeds-by-id"
          path: "/v1/feeds/{feed_id}"
          operations:
            - name: "feeds_getfeed"
              method: GET
              description: "Get Feed"
              inputParameters:
                - name: "feed_id"
                  in: path
                  type: string
                  required: true
                  description: "feed_id parameter"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: "feeds_deletefeed"
              method: DELETE
              description: "Delete Feed"
              inputParameters:
                - name: "feed_id"
                  in: path
                  type: string
                  required: true
                  description: "feed_id parameter"
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Body"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "feeds-by-id-messages"
          path: "/v1/feeds/{feed_id}/messages"
          operations:
            - name: "feeds_publishmessages"
              method: POST
              description: "Publish Messages"
              inputParameters:
                - name: "feed_id"
                  in: path
                  type: string
                  required: true
                  description: "feed_id parameter"
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Body"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: "feeds_listmessages"
              method: GET
              description: "List Feed Messages"
              inputParameters:
                - name: "feed_id"
                  in: path
                  type: string
                  required: true
                  description: "feed_id parameter"
                - name: "after_sequence"
                  in: query
                  type: string
                  required: false
                  description: "after_sequence parameter"
                - name: "limit"
                  in: query
                  type: string
                  required: false
                  description: "limit parameter"
