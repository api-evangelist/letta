naftiko: "1.0.0-alpha2"

info:
  label: "Letta API — Groups"
  description: >-
    Multi-agent groups — coordinate supervisor/worker, round-robin, and sleep-time agent collectives. 11 operations. Lead operation: List Groups. Self-contained Naftiko capability covering one Letta business surface.
  tags:
    - Letta
    - Stateful Agents
    - Groups
  created: "2026-05-08"
  modified: "2026-05-22"

binds:
  - namespace: env
    keys:
      LETTA_API_KEY: LETTA_API_KEY

capability:

  consumes:
    - type: http
      namespace: "letta-groups"
      baseUri: "https://api.letta.com"
      description: "Letta API — Groups business capability. Self-contained, no shared references."
      authentication:
        type: bearer
        token: "{{env.LETTA_API_KEY}}"
      resources:
        - name: "groups"
          path: "/v1/groups/"
          operations:
            - name: "list_groups"
              method: GET
              description: "List Groups"
              inputParameters:
                - name: "manager_type"
                  in: query
                  type: string
                  required: false
                  description: "Search groups by manager type"
                - name: "before"
                  in: query
                  type: string
                  required: false
                  description: "Group ID cursor for pagination. Returns groups that come before this group ID in the specified sort order"
                - name: "after"
                  in: query
                  type: string
                  required: false
                  description: "Group ID cursor for pagination. Returns groups that come after this group ID in the specified sort order"
                - name: "limit"
                  in: query
                  type: string
                  required: false
                  description: "Maximum number of groups to return"
                - name: "order"
                  in: query
                  type: string
                  required: false
                  description: "Sort order for groups by creation time. 'asc' for oldest first, 'desc' for newest first"
                - name: "order_by"
                  in: query
                  type: string
                  required: false
                  description: "Field to sort by"
                - name: "project_id"
                  in: query
                  type: string
                  required: false
                  description: "Search groups by project id"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: "create_group"
              method: POST
              description: "Create Group"
              inputParameters:
                - name: "X-Project"
                  in: header
                  type: string
                  required: false
                  description: "The project slug to associate with the group (cloud only)."
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Request payload"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "groups-count"
          path: "/v1/groups/count"
          operations:
            - name: "count_groups"
              method: GET
              description: "Count Groups"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "groups-by-id"
          path: "/v1/groups/{group_id}"
          operations:
            - name: "retrieve_group"
              method: GET
              description: "Retrieve Group"
              inputParameters:
                - name: "group_id"
                  in: path
                  type: string
                  required: true
                  description: "The ID of the group in the format 'group-<uuid4>'"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: "modify_group"
              method: PATCH
              description: "Modify Group"
              inputParameters:
                - name: "group_id"
                  in: path
                  type: string
                  required: true
                  description: "The ID of the group in the format 'group-<uuid4>'"
                - name: "X-Project"
                  in: header
                  type: string
                  required: false
                  description: "The project slug to associate with the group (cloud only)."
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Request payload"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: "delete_group"
              method: DELETE
              description: "Delete Group"
              inputParameters:
                - name: "group_id"
                  in: path
                  type: string
                  required: true
                  description: "The ID of the group in the format 'group-<uuid4>'"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "groups-by-id-messages-by-id"
          path: "/v1/groups/{group_id}/messages/{message_id}"
          operations:
            - name: "modify_group_message"
              method: PATCH
              description: "Modify Group Message"
              inputParameters:
                - name: "group_id"
                  in: path
                  type: string
                  required: true
                  description: "The ID of the group in the format 'group-<uuid4>'"
                - name: "message_id"
                  in: path
                  type: string
                  required: true
                  description: "The ID of the message in the format 'message-<uuid4>'"
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Request payload"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "groups-by-id-messages"
          path: "/v1/groups/{group_id}/messages"
          operations:
            - name: "list_group_messages"
              method: GET
              description: "List Group Messages"
              inputParameters:
                - name: "group_id"
                  in: path
                  type: string
                  required: true
                  description: "The ID of the group in the format 'group-<uuid4>'"
                - name: "before"
                  in: query
                  type: string
                  required: false
                  description: "Message ID cursor for pagination. Returns messages that come before this message ID in the specified sort order"
                - name: "after"
                  in: query
                  type: string
                  required: false
                  description: "Message ID cursor for pagination. Returns messages that come after this message ID in the specified sort order"
                - name: "limit"
                  in: query
                  type: string
                  required: false
                  description: "Maximum number of messages to retrieve"
                - name: "order"
                  in: query
                  type: string
                  required: false
                  description: "Sort order for messages by creation time. 'asc' for oldest first, 'desc' for newest first"
                - name: "order_by"
                  in: query
                  type: string
                  required: false
                  description: "Field to sort by"
                - name: "use_assistant_message"
                  in: query
                  type: boolean
                  required: false
                  description: "Whether to use assistant messages"
                - name: "assistant_message_tool_name"
                  in: query
                  type: string
                  required: false
                  description: "The name of the designated message tool."
                - name: "assistant_message_tool_kwarg"
                  in: query
                  type: string
                  required: false
                  description: "The name of the message argument."
                - name: "include_return_message_types"
                  in: query
                  type: string
                  required: false
                  description: "Message types to include in response. When null, all message types are returned."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "groups-by-id-reset-messages"
          path: "/v1/groups/{group_id}/reset-messages"
          operations:
            - name: "reset_group_messages"
              method: PATCH
              description: "Reset Group Messages"
              inputParameters:
                - name: "group_id"
                  in: path
                  type: string
                  required: true
                  description: "The ID of the group in the format 'group-<uuid4>'"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "groups-by-id-blocks-attach-by-id"
          path: "/v1/groups/{group_id}/blocks/attach/{block_id}"
          operations:
            - name: "attach_block_to_group"
              method: PATCH
              description: "Attach Block to Group"
              inputParameters:
                - name: "block_id"
                  in: path
                  type: string
                  required: true
                  description: "block_id parameter"
                - name: "group_id"
                  in: path
                  type: string
                  required: true
                  description: "The ID of the group in the format 'group-<uuid4>'"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "groups-by-id-blocks-detach-by-id"
          path: "/v1/groups/{group_id}/blocks/detach/{block_id}"
          operations:
            - name: "detach_block_from_group"
              method: PATCH
              description: "Detach Block from Group"
              inputParameters:
                - name: "block_id"
                  in: path
                  type: string
                  required: true
                  description: "block_id parameter"
                - name: "group_id"
                  in: path
                  type: string
                  required: true
                  description: "The ID of the group in the format 'group-<uuid4>'"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
