    - type: mcp
      namespace: "letta-groups-mcp"
      port: 9090
      transport: http
      description: "MCP adapter for Letta API — Groups. One verb-noun tool per consumed operation."
      tools:
        - name: "list-groups"
          description: "List Groups"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "letta-groups.list_groups"
          with:
            "manager_type": "tools.manager_type"
            "before": "tools.before"
            "after": "tools.after"
            "limit": "tools.limit"
            "order": "tools.order"
            "order_by": "tools.order_by"
            "project_id": "tools.project_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: "create-group"
          description: "Create Group"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "letta-groups.create_group"
          with:
            "X-Project": "tools.X-Project"
            "body": "tools.body"
