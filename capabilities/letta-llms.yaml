naftiko: "1.0.0-alpha2"

info:
  label: "Letta API — LLMs"
  description: >-
    LLMs — enumerate configured language models. 2 operations. Lead operation: List LLM Models. Self-contained Naftiko capability covering one Letta business surface.
  tags:
    - Letta
    - Stateful Agents
    - LLMs
  created: "2026-05-08"
  modified: "2026-05-22"

binds:
  - namespace: env
    keys:
      LETTA_API_KEY: LETTA_API_KEY

capability:

  consumes:
    - type: http
      namespace: "letta-llms"
      baseUri: "https://api.letta.com"
      description: "Letta API — LLMs business capability. Self-contained, no shared references."
      authentication:
        type: bearer
        token: "{{env.LETTA_API_KEY}}"
      resources:
        - name: "models"
          path: "/v1/models/"
          operations:
            - name: "list_models"
              method: GET
              description: "List LLM Models"
              inputParameters:
                - name: "provider_category"
                  in: query
                  type: string
                  required: false
                  description: "provider_category parameter"
                - name: "provider_name"
                  in: query
                  type: string
                  required: false
                  description: "provider_name parameter"
                - name: "provider_type"
                  in: query
                  type: string
                  required: false
                  description: "provider_type parameter"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "models-embedding"
          path: "/v1/models/embedding"
          operations:
            - name: "list_embedding_models"
              method: GET
              description: "List Embedding Models"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      namespace: "letta-llms-rest"
      port: 8080
      description: "REST adapter for Letta API — LLMs. One Spectral-compliant resource per consumed operation."
      resources:
        - path: "/v1/models/"
          name: "models"
          description: "REST surface for models."
          operations:
            - method: GET
              name: "list_models"
              description: "List LLM Models"
              call: "letta-llms.list_models"
              with:
                "provider_category": "rest.provider_category"
                "provider_name": "rest.provider_name"
                "provider_type": "rest.provider_type"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: "/v1/models/embedding"
          name: "models-embedding"
          description: "REST surface for models-embedding."
          operations:
            - method: GET
              name: "list_embedding_models"
              description: "List Embedding Models"
              call: "letta-llms.list_embedding_models"
              outputParameters:
                - type: object
                  mapping: "$."
    - type: mcp
      namespace: "letta-llms-mcp"
      port: 9090
      transport: http
      description: "MCP adapter for Letta API — LLMs. One verb-noun tool per consumed operation."
      tools:
        - name: "list-llm-models"
          description: "List LLM Models"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "letta-llms.list_models"
          with:
            "provider_category": "tools.provider_category"
            "provider_name": "tools.provider_name"
            "provider_type": "tools.provider_type"
          outputParameters:
            - type: object
              mapping: "$."
        - name: "list-embedding-models"
          description: "List Embedding Models"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "letta-llms.list_embedding_models"
          outputParameters:
            - type: object
              mapping: "$."
