naftiko: "1.0.0-alpha2"

info:
  label: "Letta API — Admin"
  description: >-
    Admin — administrative operations (org / billing / policy). 2 operations. Lead operation: List Tags. Self-contained Naftiko capability covering one Letta business surface.
  tags:
    - Letta
    - Stateful Agents
    - Admin
  created: "2026-05-08"
  modified: "2026-05-22"

binds:
  - namespace: env
    keys:
      LETTA_API_KEY: LETTA_API_KEY

capability:

  consumes:
    - type: http
      namespace: "letta-admin"
      baseUri: "https://api.letta.com"
      description: "Letta API — Admin business capability. Self-contained, no shared references."
      authentication:
        type: bearer
        token: "{{env.LETTA_API_KEY}}"
      resources:
        - name: "tags"
          path: "/v1/tags/"
          operations:
            - name: "list_tags"
              method: GET
              description: "List Tags"
              inputParameters:
                - name: "before"
                  in: query
                  type: string
                  required: false
                  description: "Tag cursor for pagination. Returns tags that come before this tag in the specified sort order"
                - name: "after"
                  in: query
                  type: string
                  required: false
                  description: "Tag cursor for pagination. Returns tags that come after this tag in the specified sort order"
                - name: "limit"
                  in: query
                  type: string
                  required: false
                  description: "Maximum number of tags to return"
                - name: "order"
                  in: query
                  type: string
                  required: false
                  description: "Sort order for tags. 'asc' for alphabetical order, 'desc' for reverse alphabetical order"
                - name: "order_by"
                  in: query
                  type: string
                  required: false
                  description: "Field to sort by"
                - name: "query_text"
                  in: query
                  type: string
                  required: false
                  description: "Filter tags by text search. Deprecated, please use name field instead"
                - name: "name"
                  in: query
                  type: string
                  required: false
                  description: "Filter tags by name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: "list_tags_2"
              method: GET
              description: "List Tags"
              inputParameters:
                - name: "before"
                  in: query
                  type: string
                  required: false
                  description: "Tag cursor for pagination. Returns tags that come before this tag in the specified sort order"
                - name: "after"
                  in: query
                  type: string
                  required: false
                  description: "Tag cursor for pagination. Returns tags that come after this tag in the specified sort order"
                - name: "limit"
                  in: query
                  type: string
                  required: false
                  description: "Maximum number of tags to return"
                - name: "order"
                  in: query
                  type: string
                  required: false
                  description: "Sort order for tags. 'asc' for alphabetical order, 'desc' for reverse alphabetical order"
                - name: "order_by"
                  in: query
                  type: string
                  required: false
                  description: "Field to sort by"
                - name: "query_text"
                  in: query
                  type: string
                  required: false
                  description: "Filter tags by text search. Deprecated, please use name field instead"
                - name: "name"
                  in: query
                  type: string
                  required: false
                  description: "Filter tags by name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      namespace: "letta-admin-rest"
      port: 8080
      description: "REST adapter for Letta API — Admin. One Spectral-compliant resource per consumed operation."
      resources:
        - path: "/v1/tags/"
          name: "tags"
          description: "REST surface for tags."
          operations:
            - method: GET
              name: "list_tags"
              description: "List Tags"
              call: "letta-admin.list_tags"
              with:
                "before": "rest.before"
                "after": "rest.after"
                "limit": "rest.limit"
                "order": "rest.order"
                "order_by": "rest.order_by"
                "query_text": "rest.query_text"
                "name": "rest.name"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: GET
              name: "list_tags"
              description: "List Tags"
              call: "letta-admin.list_tags"
              with:
                "before": "rest.before"
                "after": "rest.after"
                "limit": "rest.limit"
                "order": "rest.order"
                "order_by": "rest.order_by"
                "query_text": "rest.query_text"
                "name": "rest.name"
              outputParameters:
                - type: object
                  mapping: "$."
    - type: mcp
      namespace: "letta-admin-mcp"
      port: 9090
      transport: http
      description: "MCP adapter for Letta API — Admin. One verb-noun tool per consumed operation."
      tools:
        - name: "list-tags"
          description: "List Tags"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "letta-admin.list_tags"
          with:
            "before": "tools.before"
            "after": "tools.after"
            "limit": "tools.limit"
            "order": "tools.order"
            "order_by": "tools.order_by"
            "query_text": "tools.query_text"
            "name": "tools.name"
          outputParameters:
            - type: object
              mapping: "$."
        - name: "list-tags-2"
          description: "List Tags"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "letta-admin.list_tags"
          with:
            "before": "tools.before"
            "after": "tools.after"
            "limit": "tools.limit"
            "order": "tools.order"
            "order_by": "tools.order_by"
            "query_text": "tools.query_text"
            "name": "tools.name"
          outputParameters:
            - type: object
              mapping: "$."
