        - name: "delete-file-folder"
          description: "Delete File from Folder"
          hints:
            readOnly: false
            destructive: true
            idempotent: true
          call: "letta-folders.delete_file_from_folder"
          with:
            "folder_id": "tools.folder_id"
            "file_id": "tools.file_id"
          outputParameters:
            - type: object
              mapping: "$."
