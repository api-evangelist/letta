naftiko: "1.0.0-alpha2"

info:
  label: "Letta API — Agents"
  description: >-
    Stateful agents — create, list, modify, export, and message agents with persistent memory and tools. 56 operations. Lead operation: List Agents. Self-contained Naftiko capability covering one Letta business surface.
  tags:
    - Letta
    - Stateful Agents
    - Agents
  created: "2026-05-08"
  modified: "2026-05-22"

binds:
  - namespace: env
    keys:
      LETTA_API_KEY: LETTA_API_KEY

capability:

  consumes:
    - type: http
      namespace: "letta-agents"
      baseUri: "https://api.letta.com"
      description: "Letta API — Agents business capability. Self-contained, no shared references."
      authentication:
        type: bearer
        token: "{{env.LETTA_API_KEY}}"
      resources:
        - name: "agents"
          path: "/v1/agents/"
          operations:
            - name: "list_agents"
              method: GET
              description: "List Agents"
              inputParameters:
                - name: "name"
                  in: query
                  type: string
                  required: false
                  description: "Name of the agent"
                - name: "tags"
                  in: query
                  type: string
                  required: false
                  description: "List of tags to filter agents by"
                - name: "match_all_tags"
                  in: query
                  type: boolean
                  required: false
                  description: "If True, only returns agents that match ALL given tags. Otherwise, return agents that have ANY of the passed-in tags."
                - name: "before"
                  in: query
                  type: string
                  required: false
                  description: "Cursor for pagination"
                - name: "after"
                  in: query
                  type: string
                  required: false
                  description: "Cursor for pagination"
                - name: "limit"
                  in: query
                  type: string
                  required: false
                  description: "Limit for pagination"
                - name: "query_text"
                  in: query
                  type: string
                  required: false
                  description: "Search agents by name"
                - name: "project_id"
                  in: query
                  type: string
                  required: false
                  description: "Search agents by project ID - this will default to your default project on cloud"
                - name: "template_id"
                  in: query
                  type: string
                  required: false
                  description: "Search agents by template ID"
                - name: "base_template_id"
                  in: query
                  type: string
                  required: false
                  description: "Search agents by base template ID"
                - name: "identity_id"
                  in: query
                  type: string
                  required: false
                  description: "Search agents by identity ID"
                - name: "identifier_keys"
                  in: query
                  type: string
                  required: false
                  description: "Search agents by identifier keys"
                - name: "include_relationships"
                  in: query
                  type: string
                  required: false
                  description: "Specify which relational fields (e.g., 'tools', 'sources', 'memory') to include in the response. If not provided, all relationships are loaded by default. Using this can optimize performance by reduci"
                - name: "include"
                  in: query
                  type: array
                  required: false
                  description: "Specify which relational fields to include in the response. No relationships are included by default."
                - name: "order"
                  in: query
                  type: string
                  required: false
                  description: "Sort order for agents by creation time. 'asc' for oldest first, 'desc' for newest first"
                - name: "order_by"
                  in: query
                  type: string
                  required: false
                  description: "Field to sort by"
                - name: "ascending"
                  in: query
                  type: boolean
                  required: false
                  description: "Whether to sort agents oldest to newest (True) or newest to oldest (False, default)"
                - name: "sort_by"
                  in: query
                  type: string
                  required: false
                  description: "Field to sort by. Options: 'created_at' (default), 'last_run_completion'"
                - name: "last_stop_reason"
                  in: query
                  type: string
                  required: false
                  description: "Filter agents by their last stop reason."
                - name: "created_by_id"
                  in: query
                  type: string
                  required: false
                  description: "Filter agents by the user who created them."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: "create_agent"
              method: POST
              description: "Create Agent"
              inputParameters:
                - name: "X-Project"
                  in: header
                  type: string
                  required: false
                  description: "The project slug to associate with the agent (cloud only)."
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Request payload"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "agents-count"
          path: "/v1/agents/count"
          operations:
            - name: "count_agents"
              method: GET
              description: "Count Agents"
              inputParameters:
                - name: "name"
                  in: query
                  type: string
                  required: false
                  description: "Name of the agent"
                - name: "tags"
                  in: query
                  type: string
                  required: false
                  description: "List of tags to filter agents by"
                - name: "match_all_tags"
                  in: query
                  type: boolean
                  required: false
                  description: "If True, only counts agents that match ALL given tags. Otherwise, counts agents that have ANY of the passed-in tags."
                - name: "query_text"
                  in: query
                  type: string
                  required: false
                  description: "Search agents by name"
                - name: "project_id"
                  in: query
                  type: string
                  required: false
                  description: "Search agents by project ID - this will default to your default project on cloud"
                - name: "template_id"
                  in: query
                  type: string
                  required: false
                  description: "Search agents by template ID"
                - name: "base_template_id"
                  in: query
                  type: string
                  required: false
                  description: "Search agents by base template ID"
                - name: "identity_id"
                  in: query
                  type: string
                  required: false
                  description: "Search agents by identity ID"
                - name: "identifier_keys"
                  in: query
                  type: string
                  required: false
                  description: "Search agents by identifier keys"
                - name: "last_stop_reason"
                  in: query
                  type: string
                  required: false
                  description: "Filter agents by their last stop reason."
                - name: "created_by_id"
                  in: query
                  type: string
                  required: false
                  description: "Filter agents by the user who created them."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "agents-by-id-export"
          path: "/v1/agents/{agent_id}/export"
          operations:
            - name: "export_agent"
              method: GET
              description: "Export Agent"
              inputParameters:
                - name: "agent_id"
                  in: path
                  type: string
                  required: true
                  description: "agent_id parameter"
                - name: "max_steps"
                  in: query
                  type: integer
                  required: false
                  description: "max_steps parameter"
                - name: "use_legacy_format"
                  in: query
                  type: boolean
                  required: false
                  description: "If True, exports using the legacy single-agent 'v1' format with inline tools/blocks. If False, exports using the new multi-entity 'v2' format, with separate agents, tools, blocks, files, etc."
                - name: "conversation_id"
                  in: query
                  type: string
                  required: false
                  description: "Conversation ID to export. If provided, uses messages from this conversation instead of the agent's global message history."
                - name: "scrub_messages"
                  in: query
                  type: boolean
                  required: false
                  description: "If True, excludes all messages from the export. Useful for sharing agent configs without conversation history."
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Request payload"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: "export_agent_with_skills"
              method: POST
              description: "Export Agent with Skills"
              inputParameters:
                - name: "agent_id"
                  in: path
                  type: string
                  required: true
                  description: "agent_id parameter"
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Request payload"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "agents-import"
