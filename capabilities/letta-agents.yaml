  exposes:
    - type: rest
      namespace: "letta-agents-rest"
      port: 8080
      description: "REST adapter for Letta API — Agents. One Spectral-compliant resource per consumed operation."
      resources:
        - path: "/v1/agents/"
          name: "agents"
          description: "REST surface for agents."
          operations:
            - method: GET
              name: "list_agents"
              description: "List Agents"
              call: "letta-agents.list_agents"
              with:
                "name": "rest.name"
                "tags": "rest.tags"
                "match_all_tags": "rest.match_all_tags"
                "before": "rest.before"
                "after": "rest.after"
                "limit": "rest.limit"
                "query_text": "rest.query_text"
                "project_id": "rest.project_id"
                "template_id": "rest.template_id"
                "base_template_id": "rest.base_template_id"
                "identity_id": "rest.identity_id"
                "identifier_keys": "rest.identifier_keys"
                "include_relationships": "rest.include_relationships"
                "include": "rest.include"
                "order": "rest.order"
                "order_by": "rest.order_by"
                "ascending": "rest.ascending"
                "sort_by": "rest.sort_by"
                "last_stop_reason": "rest.last_stop_reason"
                "created_by_id": "rest.created_by_id"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: "create_agent"
              description: "Create Agent"
              call: "letta-agents.create_agent"
              with:
                "X-Project": "rest.X-Project"
                "body": "rest.body"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: "/v1/agents/count"
          name: "agents-count"
          description: "REST surface for agents-count."
          operations:
            - method: GET
              name: "count_agents"
              description: "Count Agents"
              call: "letta-agents.count_agents"
              with:
                "name": "rest.name"
                "tags": "rest.tags"
                "match_all_tags": "rest.match_all_tags"
                "query_text": "rest.query_text"
                "project_id": "rest.project_id"
                "template_id": "rest.template_id"
                "base_template_id": "rest.base_template_id"
                "identity_id": "rest.identity_id"
                "identifier_keys": "rest.identifier_keys"
                "last_stop_reason": "rest.last_stop_reason"
                "created_by_id": "rest.created_by_id"
              outputParameters:
                - type: object
                  mapping: "$."
