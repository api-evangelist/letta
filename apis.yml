      - type: AgentFileFormat
        url: https://github.com/letta-ai/agent-file
      - type: OpenAPI
        url: openapi/letta-openapi.json

  - aid: letta:letta-code
    name: Letta Code
    description: >-
      Letta's memory-first coding agent — a CLI plus a desktop app (and an action for
      GitHub repos). "The memory-first coding agent that remembers and learns." Builds on
      the Letta Code SDK and the broader Letta platform; offered with personal plans
      (chat.letta.com) separate from the API Plan.
