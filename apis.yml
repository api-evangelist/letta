aid: letta
url: https://raw.githubusercontent.com/api-evangelist/letta/refs/heads/main/apis.yml
name: Letta
kind: company
description: >-
  Letta (formerly MemGPT) is a stateful AI agents platform built around long-term memory,
  tool execution, and multi-agent coordination. The Letta REST API exposes 239 endpoints
  across 36 public resource categories — agents, memory blocks, archival memory, sources
  (RAG), custom tools (sandboxed/client-side/MCP), MCP servers, multi-agent groups,
  identities, runs, scheduled messages, and a streaming voice-mode endpoint. Open-source
  server (Apache-2.0, 22.9k+ stars) is available on GitHub; Letta Cloud is the managed
  offering; the Agent Development Environment (ADE) provides a web UI for inspecting
  context windows, memory blocks, and run history. Python and TypeScript SDKs ship
  alongside the REST API, and the open `.af` agent file format lets agents migrate
  between deployments.
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
tags:
  - AI
  - Agents
  - Stateful Agents
  - Memory
  - MemGPT
  - Continual Learning
  - MCP
  - Multi-Agent
  - RAG
  - Open Source
created: '2026-05-08'
modified: '2026-05-22'
