apis:
  - aid: letta:cloud
    name: Letta Cloud API
    description: >-
      REST API for managing stateful agents, memory blocks (in-context + archival/RAG),
      custom tools (sandboxed Python, client-side, MCP-delegated), sources, multi-agent
      groups (supervisor/round-robin/dynamic/sleep-time), MCP server registrations, runs,
      identities, scheduled messages, and a beta voice-mode streaming endpoint. 239 paths
      under `/v1/`. Bearer token auth (`Authorization: Bearer $LETTA_API_KEY`).
