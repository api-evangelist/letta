  - aid: letta:self-hosted
    name: Letta Self-Hosted Server
    description: >-
      Open-source Letta server (Apache-2.0) for self-hosted agent deployments. Same REST
      API surface as Letta Cloud, free to run; pay only for hosting and underlying LLM API
      usage. Default base URL is http://localhost:8283. Agents can be migrated between
      self-hosted and cloud via the open .af agent file format.
    image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    humanURL: https://github.com/letta-ai/letta
    baseURL: http://localhost:8283
    tags:
      - Open Source
      - Self-Hosted
      - Agents
      - Docker
    properties:
      - type: GitHub
        url: https://github.com/letta-ai/letta
      - type: Documentation
