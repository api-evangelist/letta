specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Letta
providerId: letta
created: '2026-05-08'
modified: '2026-05-22'
reconciled: true
tags:
- AI
- Agents
- Memory
- MemGPT
- Stateful
- FinOps
- Cost Management
- FOCUS
description: >-
  FOCUS-aligned FinOps view of Letta. Letta Cloud combines a $20/month base with
  per-active-agent ($0.10/mo) and per-second tool execution ($0.00015/sec) usage
  components. Underlying LLM tokens are pass-through at provider cost. Self-hosted Letta
  removes Letta charges entirely; you pay only infra and LLM bills.
notes: Active agent count is the dominant Letta-specific cost lever; LLM token cost typically dominates the total bill.
sources:
- https://docs.letta.com/guides/api/plans
- https://www.letta.com/
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Letta
serviceCategory: AI
billingModel:
  pricingCategory: Subscription + Usage (Per-Agent + Per-Second + LLM Pass-Through)
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Purchase
  - Usage
  - Adjustment
focusColumns:
  ServiceName: Letta Cloud
  ServiceCategory: AI
  ProviderName: Letta
  PublisherName: Letta
  InvoiceIssuerName: Letta
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
- name: plan_fee
  description: Letta Cloud monthly base fee ($20/month on API Plan).
  unit: month
  aggregation: sum
  dimensions:
  - account
- name: active_agents
  description: Active agent count, billed at $0.10/agent/month.
  unit: agent-month
  aggregation: max
  dimensions:
  - account
- name: tool_execution_seconds
  description: Tool execution time at $0.00015/sec.
  unit: second
  aggregation: sum
  dimensions:
  - account
  - tool
- name: llm_tokens
  description: Pass-through LLM token usage at provider cost.
  unit: token
  aggregation: sum
  dimensions:
  - account
  - model
principles:
- name: Visibility
  description: Track active agent count, tool execution time, and LLM token spend in Letta dashboard.
- name: Allocation
  description: Tag agents to consuming product surfaces.
- name: Optimization
  description: Archive idle agents to drop active agent count; switch to cheaper LLM models where possible; self-host for high-volume workloads.
- name: Accountability
  description: Assign owners for plan fee, agent fleet, tool budget, and LLM provider contracts separately.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
