        template_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Template Id
          description: 'Deprecated: No longer used. The id of the template the agent belongs to.'
          deprecated: true
        base_template_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Base Template Id
          description: 'Deprecated: No longer used. The base template id of the agent.'
