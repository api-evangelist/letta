      properties:
        name:
          type: string
          title: Name
          description: The name of the skill
        description:
          type: string
          title: Description
          description: Description of what the skill does
        location:
          type: string
          title: Location
          description: Path or location hint for the skill (e.g. skills/my-skill/SKILL.md)
      type: object
      required:
      - name
      - description
      - location
      title: ClientSkillSchema
      description: 'Schema for a client-side skill passed in the request.


